<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural :) - Change Password</title>
  <link rel="stylesheet" href="/homepage/users/profile.css" />
</head>
<body>
  <section class="screen" id="tela-profile">
    {{ $headerClass := "" }}
    {{if eq .UserType "organizer"}}
        {{ $headerClass = "top-bar-organizer" }}
    {{else if eq .UserType "common"}}
        {{ $headerClass = "top-bar-common" }}
    {{end}}
    
    <header class="{{ $headerClass }}">
        <div class="logo-container">
            <a href="/home">
                <img src="/images/logo6.png" alt="Logo Cultural" class="logo-img" /></a>
            </a>        
        </div>
        
        <div class="right-section">
            <div class="icons">
                {{if eq .UserType "organizer"}}
                    <a href="#" class="add-btn">Adicionar Cultural</a>
                {{end}}
                <img src="/images/notifications-icon.png" alt="Notificações" class="icon" />
                <a href="/user/profile">
                    <img src="/images/user-icon.png" alt="Usuário" class="icon">
                </a>
            </div>
        </div>
    </header>

    <div class="profile-box ">
        <div class="header-title">
            <a href="/user/profile">
                <img src="/images/goback-icon.png" alt="Go Back Arrow" class="goback-img">
            </a>
            <h2>Alterar Senha</h2>
        </div>
        <label for="new-password">Nova Senha</label>
        <input id="new-password" type="password" placeholder="Nova senha" autocomplete="new-password" />

        <label for="new-password-confirmation">Confirme a Nova Senha</label>
        <input id="new-password-confirmation" type="password" placeholder="Repita a nova senha" autocomplete="new-password" />

        <label for="current-password">Senha Atual</label>
        <input id="current-password" type="password" placeholder="Digite sua senha atual" autocomplete="current-password" />

        <div class="profile-actions">
            <button class="btn">Alterar Senha</button>
        </div>
    </div>
  </section>
    <!-- <script src="/homepage/users/profile.js"></script> -->
</body>
</html>
