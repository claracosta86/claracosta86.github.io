<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural :) - Edit Profile</title>
  <link rel="stylesheet" href="/homepage/users/profile.css" />
</head>
<body>
  <section class="screen" id="tela-profile">
    {{ $headerClass := "" }}
    {{if eq .UserType "organizer"}}
        {{ $headerClass = "top-bar-organizer" }}
    {{else if eq .UserType "common"}}
        {{ $headerClass = "top-bar-common" }}
    {{end}}
    
    <header class="{{ $headerClass }}">
        <div class="logo-container">
            <a href="/home">
                <img src="/images/logo6.png" alt="Logo Cultural" class="logo-img" /></a>
            </a>        
        </div>
        
        <div class="right-section">
            <div class="icons">
                {{if eq .UserType "organizer"}}
                    <a href="#" class="add-btn">Adicionar Cultural</a>
                {{end}}
                <img src="/images/notifications-icon.png" alt="Notificações" class="icon" />
                <a href="/user/profile">
                    <img src="/images/user-icon.png" alt="Usuário" class="icon">
                </a>
            </div>
        </div>
    </header>

    <div class="profile-box ">
        <div class="header-title">
            <a href="/user/profile">
                <img src="/images/goback-icon.png" alt="Go Back Arrow" class="goback-img">
            </a>
            <h2>Editar Perfil</h2>
        </div>
        <label for="new-name">Nome do Usuário</label>
        <input id="new-name" type="text" placeholder="Nome completo" autocomplete="given-name" />

        <label for="new-email">E-mail</label>
        <input id="new-email" type="email" placeholder="Novo e-mail" autocomplete="email" />
        
        {{if eq .UserType "organizer"}}
            <label for="new-company-name">Nome da Empresa</label>
            <input id="new-company-name" type="text" placeholder="Nome da empresa" autocomplete="organization" />
        {{end}}

        <div class="profile-actions">
            <button class="btn">Alterar Perfil</button>
        </div>
    </div>
  </section>
    <!-- <script src="/homepage/users/profile.js"></script> -->
</body>
</html>
