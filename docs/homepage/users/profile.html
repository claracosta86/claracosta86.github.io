<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural :) - User Profile</title>
  <link rel="stylesheet" href="/homepage/users/profile.css" />
</head>
<body>
  <section class="screen" id="tela-profile">
    <header class="top-bar">
        <div class="logo-container">
            <img src="../../images/logo6.png" alt="Logo Cultural" class="logo-img" />
        </div>

        <div class="right-section">
            <a href="#" class="add-btn">Adicionar Espaço</a>
            <div class="icons">
                <img src="../../images/notifications-icon.png" alt="Notificações" class="icon" />
                <a href="/users/profile">
                    <img src="../../images/user-icon.png" alt="Usuário" class="icon">
                </a>
            </div>
        </div>
    </header>

    <main class="profile-content">
        <h1>Perfil do Usuário</h1>
        <div class="profile-details">
            <img src="../../images/user-avatar.png" alt="Avatar do Usuário" class="avatar">
            <p class="username">Nome do Usuário</p>
        </div>  
        <div class="profile-actions">
            <button class="btn edit-profile">Editar Perfil</button>
            <button class="btn logout">Sair</button>
        </div>
        <div class="user-events">
            <h2>Meus Eventos</h2>
            <ul class="event-list">
                <li class="event-item">
                    <img src="../../images/event-thumbnail.png" alt="Thumbnail do Evento" class="event-thumbnail">
                    <div class="event-info">
                        <p class="event-title">Título do Evento</p>
                        <p class="event-date">Data do Evento</p>
                        <p class="event-location">Localização do Evento</p>
                    </div>
                </li>
                <!-- Mais eventos podem ser listados aqui -->
            </ul>
        </div>
    </main>
  </section>
    <script src="/homepage/users/profile.js"></script>
</body>
</html>
