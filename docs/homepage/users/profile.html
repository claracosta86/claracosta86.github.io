<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural :) - User Profile</title>
  <link rel="stylesheet" href="/homepage/users/profile.css" />
</head>
<body>
  <section class="screen" id="tela-profile">
     <header class="top-bar">
        <div class="logo-container">
            <img src="/images/logo6.png" alt="Logo Cultural" class="logo-img" />
        </div>

        <div class="right-section">
            {{if eq .UserType "organizer"}}
            <a href="#" class="add-btn">Adicionar Espaço</a>
            {{end}}
            <div class="icons">
                <img src="/images/notifications-icon.png" alt="Notificações" class="icon" />
                <a href="/user/profile">
                    <img src="/images/user-icon.png" alt="Usuário" class="icon">
                </a>
            </div>
        </div>
    </header>

    <div class="profile-box ">
        <div class="header-title">
            <a href="/home">
                <img src="/images/goback.png" alt="Go Back Arrow" class="goback-img">
            </a>
            <h2>Seu Perfil</h2>
        </div>
        <label for="name">Nome do Usuário</label>
        <input id="name" type="text"  placeholder="Nome completo" autocomplete="given-name" />

        <label for="email">E-mail</label>
        <input id="email" type="email"  placeholder="E-mail" autocomplete="email" />

        <div class="profile-actions">
            <button class="btn">Editar Perfil</button>
            <button class="btn">Editar Senha</button>
            <button class="btn">Ver Favoritos</button>
        </div>
    </div>

    <div class="logout-container">
        <a href="/" class="logout-btn">Log Out</a>
    </div>
  </section>
    <!-- <script src="/homepage/users/profile.js"></script> -->
</body>
</html>
