<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural :) - User Registration</title>
  <link rel="stylesheet" href="/registerpage/register.css" />
</head>
<body>
  <section class="screen" id="tela-login">
    <a href="/">
      <img src="/images/logo6.png" alt="Logo Cultural" class="logo-img">
    </a>
    <div class="login-box">
      <h2>Crie sua conta</h2>
      <form id="registerUser">
        <label for="name" class="required">Nome</label>
        <input id="name" type="text"  placeholder="Nome completo" autocomplete="given-name" />

        <label for="email" class="required">Email</label>
        <input id="email" type="email" placeholder="email@exemplo.com" autocomplete="email"/>

        {{if eq .UserType "organizer"}}
          <label for="document" class="required">CNPJ</label>
            <input id="document" type="text" placeholder="CNPJ (apenas números)" />
        {{else}}
          <label for="document" class="required">CPF</label>
            <input id="document" type="text" placeholder="CPF (apenas números)" />
        {{end}}

        {{if eq .UserType "organizer"}}
          <label for="companyName" class="required">Nome da Empresa</label>
          <input id="companyName" type="text" placeholder="Nome da empresa" />
        {{end}}

        <label for="password" class="required">Senha</label>
        <input id="password" type="password" placeholder="Digite sua senha" />

        <label for="passwordConfirm" class="required">Confirme sua senha</label>
        <input id="passwordConfirm" type="password" placeholder="Repita sua senha" />
        <span id="error-empty-field" class="error"></span>
        <span id="error-password-mismatch" class="error"></span>

        <input type="hidden" id="userType" value="{{.UserType}}" />

        <p class="button-container"><button type="submit" class="btn">Cadastrar</button></p>
      </form>

      <p class="medium-letters">Já tem uma conta? <a href="/user/login" class="link">Login</a></p>
    </div>
  </section>
  <script src="/registerpage/register.js"></script>
</body>
</html>
