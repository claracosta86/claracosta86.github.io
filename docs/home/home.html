<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brolê - Home</title>
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <section class="screen" id="tela-login">
    <header class="top-bar">
        <div class="logo-container">
            <img src="../images/logo.png" alt="Logo Brôle" class="logo-img" />
        </div>

        <div class="right-section">
            <a href="#" class="add-btn">Adicionar Espaço</a>
            <div class="icons">
                <img src="../images/notifications-icon.png" alt="Notificações" class="icon" />
                <a href="../images/profile/user.html">
                    <img src="../images/user-icon.png" alt="Usuário" class="icon">
                </a>
            </div>
        </div>
    </header>

    <main class="home-content">
        <div class="search-bar">
             <img src="../images/search-icon.png" alt="Buscar" class="search-icon" />
                <input type="text" placeholder="Buscar..." />
        </div>

        <section class="category-box">
            <h2>Principais Eventos</h2>
            <div class="card-container">
                <div class="card">
                    <img src="../images/bienal-event.png" alt="Bienal do livro" />
                    <p class="title">Bienal do livro</p>
                </div>
                <div class="card">
                    <img src="../images/cru-event.png" alt="Jogo do Cruzeiro" />
                    <p class="title">Jogo do Cruzeiro</p>
                </div>
            </div>
        </section>

        <section class="category-box">
            <h2>Principais Pontos Turísticos</h2>
            <div class="card-container">
                <div class="card">
                    <img src="../images/liberdade-attraction.png" alt="Praça da Liberdade" />
                    <p class="title">Praça Liberdade</p>
                    <p class="subtitle">Aberto 24hrs</p>
                </div>
            </div>
        </section>
    </main>
  </section>
</body>
</html>
