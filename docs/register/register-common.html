<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brolê - Login</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <section class="screen" id="tela-login">
    <a href="../index.html">
      <img src="../images/logo.png" alt="Logo Brôle" class="logo-img">
    </a>
    <div class="box login-box">
      <form id="registerUser">

        <h2>Crie sua conta</h2>
        <label>Nome</label>
        <input id="name" type="text" placeholder="Nome completo" />
        <label>Email</label>
        <input id="email" type="email" placeholder="email@exemplo.com" />
        <label>CPF</label>
        <input id="document" type="text" placeholder="CPF (apenas números)" />
        <label>Senha </label>
        <input id="password" type="password" placeholder="Digite sua senha" />
        <label>Confirme sua senha</label>
        <input id="passwordConfirm" type="password" placeholder="Repita sua senha" />

        <input id="role" type="hidden" value="common" />

        <p class="button-container"><button type="submit" class="btn">Cadastrar</button></p>
      </form>

      <p class="medium">Já tem uma conta? <a href="../login/login-common.html" class="link">Login</a></p>
    </div>
  </section>
  <script src="register.js"></script>
</body>
</html>
