<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brolê - User Register</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <section class="screen" id="tela-login">
    <a href="../index.html">
      <img src="../images/logo6.png" alt="Logo Cultural" class="logo-img">
    </a>
    <div class="login-box">
      <h2>Entre na sua conta</h2>
      <label>Email</label>
      <input type="email" placeholder="email@exemplo.com" />
      
      <label>Senha <a href="password-recovery.html" class="link-recovery">Esqueceu?</a></label>
      <input type="password" placeholder="Digite sua senha" />

      <p class="button-container"><a href="../home/home.html" class="btn">Login</a></p>

      <form id="loginForm"></form>
        <p class="small-letters">Não tem uma conta? <a href="/register" type="button" class="link">Cadastrar</a></p>
      </form>
    </div>
  </section>
  <!-- <script src="login.js"></script> -->
</body>
</html>
