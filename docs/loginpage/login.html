<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural :) - User Login</title>
  <link rel="stylesheet" href="/loginpage/login.css" />
</head>
<body>
  <section class="screen" id="tela-login">
    <a href="/">
      <img src="../images/logo6.png" alt="Logo Cultural" class="logo-img">
    </a>
    <div class="login-box">
      <h2>Entre na sua conta</h2>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="email@exemplo.com" />
        <span id="error-empty-email" class="error"></span>

        <label>Senha <a href="/user/password-recovery" type="button" class="link-recovery">Esqueceu?</a></label>
        <input id="password" type="password" placeholder="Digite sua senha" />
        <span id="error-empty-password" class="error"></span>

        <p class="button-container"><button type="submit" class="btn">Login</button></p>
      </form>
      <p class="small-letters">Não tem uma conta? <a href="/user/register" type="button" class="link">Cadastrar</a></p>
    </div>
  </section>
  <script src="/loginpage/login.js"></script>
</body>
</html>
