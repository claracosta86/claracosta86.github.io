<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brolê - User Register</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <section class="screen" id="tela-login">
    <a href="../index.html">
      <img src="../images/logo.png" alt="Logo Brôle" class="logo-img">
    </a>
    <div class="box login-box">
      <h2>Entre na sua conta</h2>
      <label>Email</label>
      <input type="email" placeholder="email@exemplo.com" id="email" />
      
      <label>Senha <a href="password-recovery-common.html" class="link-right">Esqueceu?</a></label>
      <input type="password" placeholder="Digite sua senha" id="password" />

      <p class="button-container"><a href="../home/home.html" class="btn" id="login-btn">Login</a></p>

      <p class="small">Não tem uma conta? <a href="../register/register-common.html" class="link">Cadastrar</a></p>
    </div>
  </section>
  <script src="login.js"></script>
</body>
</html>
